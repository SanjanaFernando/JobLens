server:
  port: 8080

spring:
  application:
    name: joblens-backend
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/joblens}
    username: ${DATASOURCE_USERNAME:joblens}
    password: ${DATASOURCE_PASSWORD:joblens_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/shared

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# AI & Gemini Configuration
joblens:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: https://generativelanguage.googleapis.com/v1beta
      daily-quota-limit: ${DAILY_AI_QUOTA_LIMIT:100}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
